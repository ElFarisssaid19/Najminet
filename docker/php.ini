; NajmiNet PHP settings (copied into the image by the Dockerfile).
; Errors are written to the container log (docker compose logs web) and
; never shown on the page, where they would expose SQL and file paths.
display_errors = Off
display_startup_errors = Off
log_errors = On

; Documents allow 10 MB files (classes/DocumentManager.php); the PHP
; defaults (2 MB / 8 MB) would reject them before the app sees the form.
upload_max_filesize = 10M
post_max_size = 12M
