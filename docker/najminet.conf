ServerName localhost

<Directory /var/www/html>
    # No directory listings anywhere.
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# ---------------------------------------------------------------------
# The project folder is the web root, so everything that is not a page
# or a public asset is denied here. .htaccess repeats these rules as a
# second layer for hosts that do not use this file.
# ---------------------------------------------------------------------

# Dot-folders (.git, …) and server-side folders.
<DirectoryMatch "^/var/www/html/(\.|vendor|sql|migrations|database|docker|scripts|classes|includes|middleware|uploads|storage)(/|$)">
    Require all denied
</DirectoryMatch>

# Dotfiles (.env*, .gitignore, .dockerignore, .htaccess, …).
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Build, config, docs, data and log files.
<FilesMatch "(?i)^(composer\.(json|lock)|Dockerfile|docker-compose.*\.ya?ml|.*\.(md|sql|sh|log|txt|ini|lock|dist|example|bak|orig|swp))$">
    Require all denied
</FilesMatch>
<FilesMatch "^robots\.txt$">
    Require all granted
</FilesMatch>
